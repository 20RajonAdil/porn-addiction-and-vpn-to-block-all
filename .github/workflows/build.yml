name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug --no-daemon
      - name: Commit APK into repo
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/MAAR-Shield.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apk/MAAR-Shield.apk
          git diff --cached --quiet || (git commit -m "Update APK [skip ci]" && git push origin HEAD:main)
      - uses: actions/upload-artifact@v4
        with: { name: MAAR-Shield-apk, path: apk/MAAR-Shield.apk }
