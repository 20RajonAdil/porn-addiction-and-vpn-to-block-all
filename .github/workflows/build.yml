name: Build APK and AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
      - name: Build signed APK + AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon
      - name: Commit APK and AAB into repo
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/MAAR-Shield.apk
          cp app/build/outputs/bundle/release/app-release.aab apk/MAAR-Shield.aab
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apk
          git diff --cached --quiet || (git commit -m "Update APK/AAB [skip ci]" && git push origin HEAD:main)
      - uses: actions/upload-artifact@v4
        with: { name: MAAR-Shield, path: apk/ }
